  {id:1,hw:'1',type:'单选',score:5,q:'设 $p=1$ 是素数，$q$：南京在北京的北边，$r$：苹果树是落叶乔木。则下列复合命题的真值为假的是( )',opts:['$\\lnot(p \\land q \\land \\lnot r)$','$(\\lnot p \\land q) \\to (p \\leftrightarrow r)$','$(p \\leftrightarrow q) \\lor (\\lnot p \\leftrightarrow \\lnot q)$','$\\lnot p \\lor q \\to \\lnot r$'],ans:'D',exp:'将 $p,q,r$ 的真值代入各公式得其真值。'},

  {id:51,hw:'3',type:'单选',score:3,q:'$R=\\{\\langle1,3\\rangle,\\langle2,1\\rangle,\\langle1,2\\rangle,\\langle4,3\\rangle,\\langle3,4\\rangle\\}$ 在 $A=\\{1,2,3,4\\}$ 上是( )',opts:['自反的','反对称的','对称的','传递的'],ans:'C',exp:'每对元素都是对称出现。'},
  {id:52,hw:'3',type:'单选',score:3,q:'$A=\\{1,2,4\\}$，$B=\\{3,4\\}$，$A-B=$（ ）',opts:['{1,2,3,4}','{1,2,3}','{1,2}','{4}'],ans:'C',exp:'从 $A$ 中去掉 $B$ 的元素。'},
  {id:53,hw:'3',type:'单选',score:3,q:'$A=\\{1,2,3\\}$，$B=\\{2,3,4,5\\}$，$C=\\{2,3\\}$，$(A \\cup B) \\cap C=$（ ）',opts:['{1,2}','{2,3}','{1,4,5}','{1,2,3,4,5}'],ans:'B',exp:'$A \\cup B=\\{1,2,3,4,5\\}$，与 $C$ 交为 $\\{2,3\\}$。'},
  {id:54,hw:'3',type:'单选',score:3,q:'$X \\subseteq Y$ 则一定有( )',opts:['$x \\in y$','$x \\cup y = x$','$x \\subset y$','$x \\cap y = x$'],ans:'D',exp:'子集与原集的交等于子集本身。'},
  {id:55,hw:'3',type:'单选',score:3,q:'$X \\oplus Y=\\{1,2,3\\}$，$X \\oplus Z=\\{2,3,4\\}$，$2 \\in Y$，则( )',opts:['$1 \\in Z$','$2 \\in Z$','$3 \\in Z$','$4 \\in Z$'],ans:'B',exp:'对称差的性质推导。'},
  {id:56,hw:'3',type:'单选',score:3,q:'$A=\\{a,b,c,d\\}$，$f=\\{\\langle a,d\\rangle,\\langle b,a\\rangle,\\langle c,b\\rangle,\\langle d,c\\rangle\\}$，则 $f$ 是( )',opts:['不是函数','函数但非满射非单射','满射非单射','双射'],ans:'D',exp:'每个元素恰好映射一次，且值域覆盖整个 $A$。'},
  {id:57,hw:'3',type:'单选',score:3,q:'$S=\\{1,2,3\\}$，$R=\\{\\langle x,y\\rangle | x+y>4\\}$，则 $R$ 是( )',opts:['既不自反也不反对称','对称又反对称','对称但不反对称','反对称但不对称'],ans:'A',exp:'$R=\\{\\langle2,3\\rangle,\\langle3,2\\rangle\\}$，不自反也不反对称。'},

  {id:60,hw:'3',type:'判断',score:3,q:'$A=\\{a,b,\\{b\\}\\}$，$B=\\{a\\}$，则 $B \\in A$ 且 $B \\subseteq A$。',ans:'错',exp:'$B=\\{a\\}$ 不是 $A$ 的元素（$A$ 的元素是 $a,b,\\{b\\}$），所以 $B \\notin A$。'},

  {id:63,hw:'3',type:'判断',score:3,q:'$A=\\{a,b,\\{a,b\\}\\}$，$B=\\{a,\\{b\\}\\}$，$A \\cup B=\\{a,b,\\{b\\},\\{a,b\\}\\}$。',ans:'对',exp:'并集包含所有元素。'},
  {id:64,hw:'3',type:'判断',score:3,q:'$A \\cup(B \\cap C)=(A \\cup B) \\cap(A \\cup C)$。',ans:'对',exp:'分配律。'},

  {id:66,hw:'3',type:'判断',score:3,q:'$R \\cup S$ 具有对称性，则 $R,S$ 也是对称的。',ans:'错',exp:'反例：$R$ 不对称但 $R \\cup S$ 可以对称。'},
  {id:67,hw:'3',type:'判断',score:3,q:'$M_R$ 是对称矩阵，则 $R$ 一定是对称关系。',ans:'对',exp:'邻接矩阵对称等价于关系对称。'},
  {id:68,hw:'3',type:'判断',score:3,q:'$A=\\{a,b,c,d\\}$，$R=\\{\\langle a,a\\rangle,\\langle a,c\\rangle,\\langle b,a\\rangle,\\langle c,a\\rangle,\\langle c,c\\rangle,\\langle d,a\\rangle,\\langle d,d\\rangle\\}$ 是自反的也是对称的。',ans:'错',exp:'缺少 $\\langle b,b\\rangle$，不自反。'},

// ============================================
// 状态
// ============================================
let curHW='all', answered={}, userAns={};

function init(){
  const hws=[...new Set(Q.map(q=>q.hw))];
  let navHtml='<button class="active" onclick="switchHW(\'all\',this)">全部</button>';
  const names={'1':'作业1','2-1':'作业2-1','2-2':'作业2-2','3':'作业3','4':'作业4','4-1':'作业4-1','5':'作业5'};
  hws.forEach(h=>{navHtml+=`<button onclick="switchHW('${h}',this)">${names[h]||h}</button>`});
  document.getElementById('nav').innerHTML=navHtml;
  render();
}

function switchHW(hw,el){
  curHW=hw;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function getQ(){
  return curHW==='all'?Q:Q.filter(q=>q.hw===curHW);
}

function render(){
  const qs=getQ();
  const total=qs.length;
  const done=qs.filter(q=>answered[q.id]).length;
  const correct=qs.filter(q=>answered[q.id]&&userAns[q.id]===q.ans).length;
  const wrong=done-correct;

  document.getElementById('stats').innerHTML=`
    <div class="item"><div class="num">${total}</div><div class="label">总题数</div></div>
    <div class="item"><div class="num">${done}</div><div class="label">已做</div></div>
    <div class="item"><div class="num" style="color:#52c41a">${correct}</div><div class="label">正确</div></div>
    <div class="item"><div class="num" style="color:#ff4d4f">${wrong}</div><div class="label">错误</div></div>
    <div class="item"><div class="num">${done?Math.round(correct/done*100):0}%</div><div class="label">正确率</div></div>
  `;
  document.getElementById('progress-fill').style.width=`${total?done/total*100:0}%`;

  let html='';
  qs.forEach(q=>{
    const isAns=answered[q.id];
    const isCorr=isAns&&userAns[q.id]===q.ans;
    const cls=isAns?(isCorr?'answered-correct':'answered-wrong'):'';
    html+=`<div class="question-card ${cls}" id="card-${q.id}">
      <div class="q-top">
        <span class="q-num">${q.id}. <span class="q-tag">${q.type}</span></span>
        <span>${isAns?(isCorr?'<span class="result-badge correct">✓ 正确</span>':'<span class="result-badge wrong">✗ 错误</span>'):`<span style="color:#bbb;font-size:12px">${q.score}分</span>`}</span>
      </div>
      <div class="q-body">${q.q}</div>`;

    if(q.type==='单选'||q.type==='多选'){
      const letters='ABCDEFGH';
      html+=`<div class="options" id="opts-${q.id}">`;
      q.opts.forEach((o,i)=>{
        let cls='opt';
        if(isAns){
          cls+=' disabled';
          if(q.ans.includes(letters[i]))cls+=' correct-answer';
          else if(userAns[q.id]&&userAns[q.id].includes(letters[i]))cls+=' wrong-answer';
        }
        html+=`<div class="${cls}" onclick="selectOpt(${q.id},'${letters[i]}','${q.type}')">
          <span class="letter">${letters[i]}.</span><span>${o}</span></div>`;
      });
      html+=`</div>`;
      if(q.type==='多选'&&!isAns)html+=`<div class="multi-hint">可多选</div>`;
    } else if(q.type==='填空'){
      html+=`<div class="fill-area"><input id="fill-${q.id}" placeholder="输入答案..." ${isAns?'disabled':''} 
        onkeydown="if(event.key==='Enter')submitFill(${q.id})"></div>`;
    } else if(q.type==='判断'){
      html+=`<div class="tf-btns" id="tf-${q.id}">
        <div class="tf-btn ${isAns?(q.ans==='对'?'correct-answer':'')+(userAns[q.id]==='对'&&q.ans!=='对'?' wrong-answer':'')+(isAns?' disabled':''):''}" 
          onclick="submitTF(${q.id},'对')">${isAns&&q.ans==='对'?'✓ ':''}对</div>
        <div class="tf-btn ${isAns?(q.ans==='错'?'correct-answer':'')+(userAns[q.id]==='错'&&q.ans!=='错'?' wrong-answer':'')+(isAns?' disabled':''):''}"
          onclick="submitTF(${q.id},'错')">${isAns&&q.ans==='错'?'✓ ':''}错</div>
      </div>`;
    }

    if(q.type==='单选'||q.type==='多选'){
      html+=`<div class="submit-row">
        <button class="btn btn-primary" id="sub-${q.id}" onclick="submitMC(${q.id})" ${isAns?'disabled':''}>提交</button>
        ${isAns?`<span style="font-size:13px;color:#888">正确答案: ${q.ans}</span>`:''}
      </div>`;
    }
    if(q.type==='填空'&&!isAns){
      html+=`<div class="submit-row"><button class="btn btn-primary" onclick="submitFill(${q.id})">提交</button></div>`;
    }

    html+=`<div class="explain-box ${isAns?'show':''}" id="exp-${q.id}">
      <div class="title">📝 解析</div>${q.exp}</div></div>`;
  });

  if(!qs.length)html='<div class="empty-msg">暂无题目</div>';
  document.getElementById('quiz').innerHTML=html;
  if(window.MathJax&&MathJax.typeset)MathJax.typeset();
}

// 单选/多选选择
const selectedMC={};
function selectOpt(id,letter,type){
  if(answered[id])return;
  if(!selectedMC[id])selectedMC[id]=type==='多选'?new Set():'';
  if(type==='多选'){
    if(selectedMC[id].has(letter))selectedMC[id].delete(letter);
    else selectedMC[id].add(letter);
  } else {
    selectedMC[id]=letter;
  }
  // 更新UI
  const opts=document.querySelectorAll(`#opts-${id} .opt`);
  const letters='ABCDEFGH';
  opts.forEach((o,i)=>{
    o.classList.remove('selected');
    if(type==='多选'){
      if(selectedMC[id].has(letters[i]))o.classList.add('selected');
    } else {
      if(selectedMC[id]===letters[i])o.classList.add('selected');
    }
  });
}

function submitMC(id){
  const q=Q.find(x=>x.id===id);
  let ans=selectedMC[id];
  if(!ans)return;
  if(ans instanceof Set)ans=[...ans].sort().join('');
  answered[id]=true;
  userAns[id]=ans;
  document.getElementById(`sub-${id}`).disabled=true;
  render();
}

function submitFill(id){
  if(answered[id])return;
  const input=document.getElementById(`fill-${id}`);
  const val=input.value.trim();
  if(!val)return;
  answered[id]=true;
  userAns[id]=val;
  render();
}

function submitTF(id,val){
  if(answered[id])return;
  answered[id]=true;
  userAns[id]=val;
  render();
}

// 点击题目跳转
document.addEventListener('click',e=>{
  const card=e.target.closest('.question-card');
  if(card){
    const id=card.id.replace('card-','');
    card.scrollIntoView({behavior:'smooth',block:'center'});
  }
});

init();
</script>
