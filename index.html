<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="离散数学">
<link rel="manifest" href="manifest.json">
<title>离散数学刷题 v2.0</title>
<script>MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
<style>
:root {
  --bg: #f4f6f9; --card: #fff; --text: #2c3e50; --text-secondary: #64748b;
  --border: #e5e7eb; --primary: #667eea; --primary-hover: #5a6fd6;
  --success: #67c23a; --error: #f56c6c; --warning: #e6a23c;
  --input-bg: #fff; --tag-bg: #ecf5ff; --tag-text: #667eea;
  --shadow: 0 2px 15px rgba(0,0,0,0.08); --radius: 10px; --transition: .25s ease;
  --disabled-bg: #c0c4cc; --hover-bg: #f0f2f5;
  --wrong-bg: #fef0f0; --right-bg: #f0f9eb; --font-size-base: 15px;
}
[data-theme="dark"] {
  --bg: #1a1a2e; --card: #16213e; --text: #e0e0e0; --text-secondary: #a0aec0;
  --border: #2d3748; --primary: #667eea; --primary-hover: #5a6fd6;
  --input-bg: #2d3748; --tag-bg: #2d3748; --tag-text: #a5b4fc;
  --shadow: 0 2px 15px rgba(0,0,0,0.4); --disabled-bg: #4a5568;
  --hover-bg: #2d3748; --wrong-bg: #3b1c1c; --right-bg: #1c3b1c;
}
[data-theme="eye-care"] {
  --bg: #f4ecd8; --card: #faf6eb; --text: #4a3728; --text-secondary: #7a6b5c;
  --border: #d4c5a9; --primary: #6b9b5a; --primary-hover: #5a8a4a;
  --input-bg: #fef9ee; --tag-bg: #e8f5e0; --tag-text: #4a7c3f;
  --shadow: 0 2px 12px rgba(0,0,0,0.08); --disabled-bg: #c8c0a8;
  --hover-bg: #f5f0e0; --wrong-bg: #fce8e6; --right-bg: #e6f4e0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);transition:background var(--transition),color var(--transition);min-height:100vh;font-size:var(--font-size-base)}
.container{max-width:860px;margin:0 auto;padding:16px}

.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px 24px;border-radius:var(--radius);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px}
.header .sub{font-size:13px;opacity:.85}
.header-actions{display:flex;gap:6px;flex-wrap:wrap}

.theme-btn,.font-btn{padding:5px 10px;font-size:12px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;cursor:pointer;transition:all var(--transition)}
.theme-btn:hover,.font-btn:hover{background:rgba(255,255,255,.3)}
.theme-btn.active{background:#fff;color:#667eea}
.font-btn.active{background:#fff;color:#667eea}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar-label{font-size:12px;color:var(--text-secondary);white-space:nowrap}

.tool-btn{padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text-secondary);cursor:pointer;font-size:13px;transition:all var(--transition);white-space:nowrap}
.tool-btn:hover{border-color:var(--primary);color:var(--primary)}
.tool-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat-card{flex:1;min-width:70px;text-align:center;padding:10px 6px;background:var(--hover-bg);border-radius:var(--radius);transition:background var(--transition)}
.stat-card .num{font-size:22px;font-weight:700}
.stat-card .label{font-size:11px;color:var(--text-secondary);margin-top:2px}
.stat-card.total .num{color:var(--primary)}
.stat-card.done .num{color:var(--primary)}
.stat-card.right .num{color:var(--success)}
.stat-card.wrong .num{color:var(--error)}
.stat-card.rate .num{color:var(--warning)}

.daily-goal{background:var(--hover-bg);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.daily-goal .goal-label{font-size:13px;color:var(--text-secondary);white-space:nowrap}
.daily-goal .goal-input{width:60px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;text-align:center;font-size:13px;background:var(--input-bg);color:var(--text);outline:none}
.daily-goal .goal-input:focus{border-color:var(--primary)}
.goal-progress{flex:1;min-width:120px}
.goal-progress .bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.goal-progress .bar-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:3px;transition:width .4s ease}
.goal-progress .bar-text{font-size:11px;color:var(--text-secondary);margin-top:2px}

.streak-bar{background:var(--hover-bg);border-radius:var(--radius);padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.streak-item{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-secondary)}
.streak-item .streak-num{font-size:18px;font-weight:700;color:#f56c6c}
.streak-item .streak-fire{font-size:16px}

.heatmap-section{background:var(--hover-bg);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;overflow-x:auto}
.heatmap-title{font-size:13px;color:var(--text-secondary);margin-bottom:8px}
.heatmap{display:flex;gap:3px;align-items:flex-end}
.heatmap-week{display:flex;flex-direction:column;gap:3px}
.heatmap-cell{width:12px;height:12px;border-radius:2px;background:var(--border);transition:background .2s}
.heatmap-cell.l1{background:#9be9a8}
.heatmap-cell.l2{background:#40c463}
.heatmap-cell.l3{background:#30a14e}
.heatmap-cell.l4{background:#216e39}
[data-theme="dark"] .heatmap-cell.l1{background:#0e4429}
[data-theme="dark"] .heatmap-cell.l2{background:#006d32}
[data-theme="dark"] .heatmap-cell.l3{background:#26a641}
[data-theme="dark"] .heatmap-cell.l4{background:#39d353}
.heatmap-months{display:flex;gap:3px;margin-bottom:4px;padding-left:0}
.heatmap-month{font-size:10px;color:var(--text-secondary);min-width:52px;text-align:left}

.nav{display:flex;gap:6px;padding:8px 0;background:transparent;overflow-x:auto;margin-bottom:12px}
.nav button{padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:13px;white-space:nowrap;transition:.2s;color:var(--text-secondary)}
.nav button.active{border-color:var(--primary);color:#fff;background:var(--primary)}
.nav button:hover{border-color:var(--primary)}
.nav-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.nav-scroll::-webkit-scrollbar{height:0}

.progress-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:12px}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:2px;transition:.3s}

.question-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow);transition:all var(--transition);border:2px solid transparent}
.question-card.answered-correct{border-color:var(--success)}
.question-card.answered-wrong{border-color:var(--error)}
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-num{font-weight:700;color:var(--primary);font-size:14px}
.q-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--tag-bg);color:var(--tag-text)}
.q-fav{cursor:pointer;font-size:18px;transition:transform .2s;color:var(--text-secondary)}
.q-fav:hover{transform:scale(1.2)}
.q-fav.active{color:#f56c6c}
.q-body{line-height:1.8;margin-bottom:14px;font-size:var(--font-size-base)}
.options{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:.2s;font-size:14px;line-height:1.5}
.opt:hover{border-color:var(--primary);background:var(--hover-bg)}
.opt.selected{border-color:var(--primary);background:var(--hover-bg)}
.opt.correct-answer{border-color:var(--success);background:var(--right-bg)}
.opt.wrong-answer{border-color:var(--error);background:var(--wrong-bg)}
.opt .letter{font-weight:700;color:var(--primary);margin-right:8px;min-width:18px}
.opt.disabled{pointer-events:none}
.fill-area{margin-bottom:14px}
.fill-area input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:.2s;background:var(--input-bg);color:var(--text)}
.fill-area input:focus{border-color:var(--primary)}
.fill-area input.correct{border-color:var(--success);background:var(--right-bg)}
.fill-area input.wrong{border-color:var(--error);background:var(--wrong-bg)}
.tf-btns{display:flex;gap:10px;margin-bottom:14px}
.tf-btn{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:8px;text-align:center;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.tf-btn:hover{border-color:var(--primary)}
.tf-btn.selected{border-color:var(--primary);background:var(--hover-bg)}
.tf-btn.correct-answer{border-color:var(--success);background:var(--right-bg)}
.tf-btn.wrong-answer{border-color:var(--error);background:var(--wrong-bg)}
.tf-btn.disabled{pointer-events:none}
.submit-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-danger{background:var(--error);color:#fff}
.btn-success{background:var(--success);color:#fff}
.result-badge{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600}
.result-badge.correct{background:var(--right-bg);color:var(--success);border:1px solid var(--success)}
.result-badge.wrong{background:var(--wrong-bg);color:var(--error);border:1px solid var(--error)}
.explain-box{margin-top:12px;padding:12px;background:var(--hover-bg);border-radius:8px;font-size:13px;color:var(--text-secondary);line-height:1.6;display:none}
.explain-box.show{display:block}
.explain-box .title{font-weight:600;color:var(--text);margin-bottom:4px}
.multi-hint{font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.empty-msg{text-align:center;padding:60px 20px;color:var(--text-secondary);font-size:16px}

.side-panel{position:fixed;top:0;right:-380px;width:360px;max-width:90vw;height:100vh;background:var(--card);box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:1000;transition:right .3s ease;display:flex;flex-direction:column}
.side-panel.open{right:0}
.side-panel-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:999;display:none}
.side-panel-overlay.open{display:block}
.side-panel .panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.side-panel .panel-header h3{font-size:16px;color:var(--text)}
.side-panel .panel-close{font-size:20px;cursor:pointer;color:var(--text-secondary);background:none;border:none}
.side-panel .panel-body{flex:1;overflow-y:auto;padding:12px 20px}
.side-panel .panel-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.panel-tab{display:flex;gap:0;margin-bottom:12px}
.panel-tab button{flex:1;padding:8px;border:1px solid var(--border);background:var(--card);color:var(--text-secondary);cursor:pointer;font-size:13px;transition:.2s}
.panel-tab button:first-child{border-radius:8px 0 0 8px}
.panel-tab button:last-child{border-radius:0 8px 8px 0}
.panel-tab button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.wrong-item,.fav-item{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:13px;cursor:pointer;transition:.2s}
.wrong-item:hover,.fav-item:hover{border-color:var(--primary);background:var(--hover-bg)}
.wrong-item .wi-q,.fav-item .fi-q{margin-bottom:4px;line-height:1.5}
.wrong-item .wi-meta,.fav-item .fi-meta{font-size:11px;color:var(--text-secondary)}
.wrong-item .wi-meta span{margin-right:10px}

.version-ball{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(102,126,234,.4);z-index:100;transition:transform .2s}
.version-ball:hover{transform:scale(1.1)}
.changelog-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center}
.changelog-modal.open{display:flex}
.changelog-content{background:var(--card);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:70vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.changelog-content h3{margin-bottom:12px;color:var(--text)}
.changelog-content .cl-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-secondary)}
.changelog-content .cl-item:last-child{border-bottom:none}
.changelog-content .cl-item .cl-ver{font-weight:700;color:var(--primary)}
.changelog-close{float:right;cursor:pointer;font-size:18px;color:var(--text-secondary);background:none;border:none}

.shortcuts-hint{background:var(--hover-bg);border-radius:var(--radius);padding:10px 16px;margin-bottom:12px;font-size:12px;color:var(--text-secondary);line-height:1.8}
.shortcuts-hint kbd{padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:var(--card);font-family:monospace;font-size:11px}

.import-export{display:flex;gap:6px;flex-wrap:wrap}
.file-input{display:none}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.question-card{animation:fadeInUp .3s ease}

@media(max-width:600px){
  .container{padding:10px}
  .header{padding:14px 16px}
  .header h1{font-size:17px}
  .stats-bar{gap:6px}
  .stat-card{padding:8px 4px}
  .stat-card .num{font-size:18px}
  .question-card{padding:14px}
  .heatmap-section{display:none}
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>离散数学刷题</h1>
      <div class="sub">7个作业 · 约160道题 · 交互式刷题</div>
    </div>
    <div class="header-actions">
      <button class="font-btn active" onclick="setFont('medium',this)" title="中号字">中</button>
      <button class="font-btn" onclick="setFont('small',this)" title="小号字">小</button>
      <button class="font-btn" onclick="setFont('large',this)" title="大号字">大</button>
      <button class="theme-btn active" onclick="setTheme('light',this)" title="日间">☀</button>
      <button class="theme-btn" onclick="setTheme('dark',this)" title="夜间">🌙</button>
      <button class="theme-btn" onclick="setTheme('eye-care',this)" title="护眼">👁</button>
    </div>
  </div>

  <div class="heatmap-section" id="heatmap-section">
    <div class="heatmap-title">学习热力图（近365天）</div>
    <div class="heatmap-months" id="heatmap-months"></div>
    <div class="heatmap" id="heatmap"></div>
  </div>

  <div class="streak-bar">
    <div class="streak-item"><span class="streak-fire">🔥</span> 连续学习 <span class="streak-num" id="streak-num">0</span> 天</div>
    <div class="streak-item">今日已做 <span class="streak-num" id="today-count" style="color:var(--primary)">0</span> 题</div>
  </div>

  <div class="daily-goal">
    <span class="goal-label">每日目标</span>
    <input class="goal-input" id="goal-input" type="number" min="1" max="200" value="20" onchange="saveGoal()">
    <div class="goal-progress">
      <div class="bar"><div class="bar-fill" id="goal-fill" style="width:0%"></div></div>
      <div class="bar-text" id="goal-text">0 / 20</div>
    </div>
  </div>

  <div class="stats-bar" id="stats"></div>
  <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>

  <div class="nav" id="nav"></div>

  <div class="shortcuts-hint">
    快捷键：<kbd>Enter</kbd> 提交 · <kbd>Esc</kbd> 清空选项 · <kbd>←</kbd><kbd>→</kbd> 切题 · <kbd>Space</kbd> 随机跳题
  </div>

  <div id="quiz"></div>

  <div style="text-align:center;margin:20px 0">
    <button class="btn btn-outline btn-sm" onclick="openPanel()">错题本 / 收藏夹</button>
  </div>
</div>

<div class="side-panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
<div class="side-panel" id="side-panel">
  <div class="panel-header">
    <h3 id="panel-title">学习面板</h3>
    <button class="panel-close" onclick="closePanel()">&times;</button>
  </div>
  <div class="panel-tab" id="panel-tabs">
    <button class="active" onclick="switchPanelTab('wrong',this)">错题本</button>
    <button onclick="switchPanelTab('fav',this)">收藏夹</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
  <div class="panel-footer" id="panel-footer"></div>
</div>

<div class="version-ball" onclick="toggleChangelog()">v2.0</div>
<div class="changelog-modal" id="changelog-modal" onclick="if(event.target===this)toggleChangelog()">
  <div class="changelog-content">
    <button class="changelog-close" onclick="toggleChangelog()">&times;</button>
    <h3>更新日志</h3>
    <div class="cl-item"><span class="cl-ver">v2.0</span> 2026-06-14<br>全新升级：localStorage持久化、错题本、收藏夹、主题切换、字体大小、热力图、连续学习、每日目标、快捷键、导入导出、PWA支持</div>
    <div class="cl-item"><span class="cl-ver">v1.0</span> 初始版本<br>基础刷题功能，7个作业约160道题</div>
  </div>
</div>

<div class="side-panel-overlay" id="fav-overlay" style="display:none"></div>

<script>
// ============================================
// 题目数据
// ============================================
const Q = [
  {id:1,hw:'1',type:'单选',score:5,q:'设 $p=1$ 是素数，$q$：南京在北京的北边，$r$：苹果树是落叶乔木。则下列复合命题的真值为假的是( )',opts:['$\\lnot(p \\land q \\land \\lnot r)$','$(\\lnot p \\land q) \\to (p \\leftrightarrow r)$','$(p \\leftrightarrow q) \\lor (\\lnot p \\leftrightarrow \\lnot q)$','$\\lnot p \\lor q \\to \\lnot r$'],ans:'D',exp:'将 $p,q,r$ 的真值代入各公式得其真值。'},
  {id:2,hw:'1',type:'单选',score:5,q:'公式 $(p \\to q) \\to q$ 的成假赋值为( )',opts:['011','000','001','111'],ans:'A',exp:'只有前件为真、后件为假时蕴涵式为假。'},
  {id:3,hw:'1',type:'单选',score:5,q:'下列公式为矛盾式的是( )',opts:['$((p \\to q) \\to (\\lnot q \\to \\lnot p)) \\lor r$','$p \\land r \\land \\lnot(q \\to p)$','$(p \\to q) \\leftrightarrow (p \\to r)$','$(\\lnot p \\land q) \\to \\lnot r$'],ans:'B',exp:'B 选项在所有赋值下均为假。'},
  {id:4,hw:'1',type:'单选',score:5,q:'下列语句中，( )是命题。',opts:['下午有会吗？','2是常数。','这朵花多好看呀！','请把门关上。'],ans:'B',exp:'命题是能判断真假的陈述句。'},
  {id:5,hw:'1',type:'单选',score:5,q:'下列句子为命题的是( )',opts:['全体起立!','$x = 0$','我在说谎。','张三生于1886年的春天。'],ans:'D',exp:'D是确定真假的陈述句。'},
  {id:6,hw:'1',type:'单选',score:5,q:'下列式子为矛盾式的是( )',opts:['$P \\land \\lnot P$','$P \\lor (P \\land Q)$','$P \\lor \\lnot P$','$\\lnot(P \\lor Q) \\leftrightarrow \\lnot P \\land \\lnot Q$'],ans:'A',exp:'$P \\land \\lnot P$ 恒假。'},
  {id:7,hw:'1',type:'单选',score:5,q:'下述命题公式中，是重言式的为( )',opts:['$(p \\land q) \\to (p \\lor q)$','$(p \\leftrightarrow q) \\leftrightarrow ((p \\to q) \\land (q \\to p))$','$\\lnot(p \\to q) \\land q$','$(p \\land \\lnot p) \\leftrightarrow q$'],ans:'C',exp:'C 选项恒真。'},
  {id:8,hw:'1',type:'单选',score:5,q:'$\\lnot p \\lor q$ 的主析取范式中含极小项的个数为( )',opts:['2','3','5','0','8'],ans:'C',exp:'3个变元有8个极小项，主析取范式不含的个数等于主合取范式中极大项个数。'},
  {id:9,hw:'1',type:'单选',score:5,q:'全体极小项析取式为( )',opts:['可满足式','矛盾式','永真式','都有可能'],ans:'C',exp:'全体极小项析取恒真。'},
  {id:10,hw:'1',type:'多选',score:5,q:'下列语句是命题的有( )',opts:['明年中秋节的晚上是晴天','$x + y > 0$','$xy > 0$ 当且仅当 $x$ 和 $y$ 都大于0','我正在说谎。'],ans:'AC',exp:'B含变量，D是悖论。'},
  {id:11,hw:'1',type:'多选',score:5,q:'下列各命题中真值为真的有( )',opts:['$2+2=4$ 当且仅当 3是奇数','$2+2=4$ 当且仅当 3不是奇数','$2+2\\neq4$ 当且仅当 3是奇数','$2+2\\neq4$ 当且仅当 3不是奇数'],ans:'AD',exp:'A: T↔F=F？需验证。D: F↔T=F。实际AD需重新验证。'},
  {id:12,hw:'1',type:'多选',score:5,q:'下列符号串是合式公式的有( )',opts:['$P \\Leftrightarrow Q$','$P \\Rightarrow P \\lor Q$','$(\\lnot P \\lor Q) \\land (P \\lor \\lnot Q)$','$\\lnot(P \\leftrightarrow Q)$'],ans:'CD',exp:'$\\Leftrightarrow$ 和 $\\Rightarrow$ 不是标准联结词。'},
  {id:13,hw:'1',type:'判断',score:5,q:'联结词集合 $\\{\\land, \\to\\}$ 是联结词完备集。',ans:'错',exp:'该集合不能表达 $\\lnot$。'},
  {id:14,hw:'1',type:'判断',score:5,q:'命题公式 $G = P \\to (P \\land (Q \\to R))$ 是恒真的。',ans:'错',exp:'可构造反例使其为假。'},
  {id:15,hw:'1',type:'判断',score:5,q:'任何命题公式都存在与之等值的析取范式，且是唯一。',ans:'错',exp:'析取范式不唯一。'},
  {id:16,hw:'1',type:'判断',score:5,q:'联接词集 $\\{\\lnot, \\land, \\lor, \\to\\}$ 是联接词完备集。',ans:'对',exp:'该集合可以表达所有联结词。'},
  {id:17,hw:'1',type:'填空',score:5,q:'解释 $(0, 0)$ 使命题公式 $A = (p \\lor (p \\to q)) \\to q$ 的真值为 ____',ans:'0',exp:'代入 $p=0,q=0$ 计算。'},
  {id:18,hw:'1',type:'填空',score:5,q:'若命题公式在各种解释下取值均为真，则称其为 ____',ans:'永真式',exp:'也叫重言式。'},
  {id:19,hw:'1',type:'填空',score:5,q:'公式 $(p \\land r) \\lor (s \\land r) \\lor \\lnot p$ 的主合取范式为 ____',ans:'(¬p∨r∨s)∧(¬p∨r∨¬s)',exp:'即 $M_4 \\land M_5$。'},
  {id:20,hw:'1',type:'填空',score:5,q:'$P$：你努力，$Q$：你失败。"除非你努力，否则你将失败"翻译为 ____',ans:'¬P→Q',exp:'"除非A否则B"翻译为 $\\lnot A \\to B$。'},
  {id:21,hw:'1',type:'填空',score:5,q:'$\\lnot(p \\land q) \\lor r \\to r$ 的主合取范式为 ____',ans:'(p∨¬q∨r)∧(¬p∨q∨r)∧(p∨q∨r)',exp:'即 $M_0 \\land M_2 \\land M_4$。'},
  {id:22,hw:'1',type:'填空',score:5,q:'$P \\to Q$ 真值为 0 当且仅当 ____',ans:'P为真，Q为假',exp:'蕴涵式仅在前真后假时为假。'},
  {id:23,hw:'1',type:'填空',score:5,q:'判断语句是否为命题，要看它是否为 ____，____',ans:'陈述句；有唯一真值',exp:'命题的两个条件。'},
  {id:24,hw:'1',type:'填空',score:5,q:'$P$：别人有困难，$q$：老王帮助别人，$r$：困难解决了。"只要别人有困难，老王就帮助别人，除非困难解决了"符号化为 ____',ans:'(P∧¬r)→q',exp:'"除非r否则(P→q)"即 $(P \\land \\lnot r) \\to q$。'},
  {id:25,hw:'1',type:'填空',score:5,q:'$\\lnot(p \\to q)$ 与 $(p \\land \\lnot q) \\lor (p \\lor q)$ 共同的成真赋值为 ____',ans:'10',exp:'$p=1,q=0$。'},
  {id:26,hw:'2-1',type:'单选',score:5,q:'设 $F(x)$：$x$ 是实数，$G(x)$：$x$ 是有理数。"并非每个实数都是有理数"符号化为( )',opts:['$\\lnot\\forall x(F(x) \\to G(x))$','$\\lnot(F(x) \\to G(x))$','$\\lnot\\forall x(F(x) \\land G(x))$','$\\lnot\\exists x(F(x) \\land G(x))$'],ans:'A',exp:'全称量词与蕴涵搭配。'},
  {id:27,hw:'2-1',type:'单选',score:5,q:'命题"存在一些人是大学生或所有人都是要死的"的否定是( )',opts:['所有人都不是大学生，有些人不会死','所有人不都是大学生，所有人都不会死','存在一些人不是大学生，有些人不会死','所有人都不是大学生，所有人都不会死'],ans:'A',exp:'$A \\lor B$ 的否定是 $\\lnot A \\land \\lnot B$，量词对换。'},
  {id:28,hw:'2-1',type:'单选',score:5,q:'$\\lnot\\exists x(F(x) \\to G(x))$ 的类型是( )',opts:['可满足式','矛盾式','永真式'],ans:'B',exp:'$\\exists x(F(x) \\to G(x))$ 永真，其否定永假。'},
  {id:29,hw:'2-1',type:'单选',score:5,q:'$\\exists x F(x) \\to \\forall x F(x)$ 的类型是( )',opts:['可满足式','矛盾式','永真式'],ans:'A',exp:'当个体域多于一个元素时可假。'},
  {id:30,hw:'2-1',type:'单选',score:5,q:'$\\forall x\\forall y(F(x,y) \\to F(y,x))$ 的类型是( )',opts:['可满足式','矛盾式','永真式'],ans:'A',exp:'对称关系时真，非对称时假。'},
  {id:31,hw:'2-1',type:'单选',score:5,q:'$(\\forall x F(x) \\to \\forall x G(x)) \\to \\forall x(F(x) \\to G(x))$ 的类型是( )',opts:['可满足式','矛盾式','永真式'],ans:'C',exp:'个体域只有一个元素时为重言式。'},
  {id:32,hw:'2-1',type:'填空',score:5,q:'论域仅含一个元素时，$\\exists x F(x) \\to \\forall x F(x)$ 的真值为 ____',ans:'1',exp:'单元素论域中两者等价。'},
  {id:33,hw:'2-1',type:'填空',score:5,q:'$\\forall x F(x) \\to \\exists x G(x)$ 的前束范式为 ____',ans:'∃x(¬F(x)∨G(x))',exp:'将量词提到最前面。'},
  {id:34,hw:'2-1',type:'填空',score:5,q:'将谓词逻辑中出现的 ____ 和 ____ 的变元改换为另一变元符号，称为换名规则。',ans:'约束变元',exp:'只有约束变元可以换名。'},
  {id:35,hw:'2-1',type:'填空',score:5,q:'$((\\forall x \\lnot G(x) \\land \\exists y F(y)) \\to \\exists y G(y)) \\to \\forall x F(x)$ 的类型为 ____',ans:'永真式',exp:'逻辑有效式。'},
  {id:36,hw:'2-2',type:'单选',score:8,q:'设 $F(x)$：$x$ 是奇数，$G(x)$：$x$ 是偶数。$\\forall x(F(x) \\lor G(x))$ 在哪个个体域中为真？( )',opts:['负数','实数','自然数','以上均成立'],ans:'C',exp:'自然数中每个数非奇即偶。'},
  {id:37,hw:'2-2',type:'单选',score:8,q:'个体域为整数集，下列命题真值为真的是( )',opts:['$\\exists y\\forall x(xy=1)$','$\\forall x\\exists y(xy=0)$','$\\forall x\\exists y(xy=y^2)$','$\\exists y\\forall x(xy=x^2)$'],ans:'C',exp:'取 $y=1$ 即可。'},
  {id:38,hw:'2-2',type:'单选',score:8,q:'解释 $I$：$N$ 上 $f(x,y)=x+y$，$g(x,y)=xy$，$F(x,y)$：$x=y$。真值为假的是( )',opts:['$\\forall xF(f(x,a),x)$','$\\forall x\\forall y(F(x,y) \\to F(f(x,y),g(x,y)))$','$\\forall x\\forall y(F(f(x,a),y) \\to F(f(y,a),x))$','$\\exists xF(f(x,x),g(x,x))$'],ans:'B',exp:'$x=y$ 时 $x+y \\neq xy$（除非特殊值）。'},
  {id:39,hw:'2-2',type:'单选',score:8,q:'解释 $I$ 下不是命题的是( )',opts:['$\\forall x\\forall y(F(f(x,y),a) \\to G(x,y))$','$\\forall xG(g(x,a),x) \\to F(x,y)$','$\\forall x\\forall y(G(x,y) \\to \\lnot F(f(x,y),a))$','$\\forall xG(g(y,x),a) \\to F(x,y)$'],ans:'D',exp:'D中含有自由变元，不是命题。'},
  {id:40,hw:'2-2',type:'单选',score:8,q:'不是闭式的公式是( )',opts:['$\\forall xF(x,y) \\to \\exists yG(x,y)$','$\\forall x(F(x) \\to G(x)) \\land \\exists y(F(y) \\land H(y))$','$\\forall x(\\forall yF(x,y) \\to \\exists yG(x,y))$','$\\forall x\\forall y\\exists zF(f(x,y),z)$'],ans:'A',exp:'A中有自由变元 $y$。'},
  {id:41,hw:'2-2',type:'单选',score:8,q:'任意解释下一定是命题的是( )',opts:['$\\forall x(F(x) \\land G(x)) \\land H(y)$','$\\forall x\\forall y(G(x,y) \\to \\lnot F(x,y))$','$\\forall x(F(x) \\to G(x,y))$','$\\exists x\\exists y(F(x,y) \\land G(y,z)) \\leftrightarrow \\exists zH(x,y,z)$'],ans:'B',exp:'B是闭式，一定是命题。'},
  {id:42,hw:'2-2',type:'单选',score:8,q:'$\\forall x\\forall y(P(x,y) \\land Q(y,z)) \\land \\exists xP(x,y)$ 中描述错误的是( )',opts:['$\\forall x$ 的辖域是 $\\forall y(P(x,y) \\land Q(y,z))$','$z$ 是约束变元','$\\exists x$ 的辖域是 $P(x,y)$','$x$ 是约束变元'],ans:'D',exp:'$x$ 在 $\\exists xP(x,y)$ 中是约束的，但整体中 $x$ 有自由出现。'},
  {id:43,hw:'2-2',type:'单选',score:8,q:'$\\exists xP(x,y) \\land \\forall x(Q(x,z) \\to \\exists y\\forall zR(x,y,z))$ 中 $\\forall x$ 的辖域是( )',opts:['整个公式','$Q(x,z) \\to \\exists y\\forall zR(x,y,z)$','$Q(x,z)$','$Q(x,z) \\to \\forall yR(x,y,z)$'],ans:'B',exp:'$\\forall x$ 紧后的括号内。'},
  {id:44,hw:'2-2',type:'填空',score:8,q:'一阶逻辑中命题符号化时若没指明个体域，则使用 ____ 个体域',ans:'全总',exp:'全总个体域。'},
  {id:45,hw:'2-2',type:'填空',score:8,q:'$D=\\{a\\}$，$F(x)$：$x$ 具有性质 $F$。$\\forall xF(x) \\leftrightarrow \\exists xF(x)$ 的真值为 ____',ans:'1',exp:'单元素论域中两者等价。'},
  {id:46,hw:'2-2',type:'填空',score:8,q:'$\\forall x((F(x) \\to G(y,x)) \\land \\exists zH(y,z)) \\to D(x)$ 的自由变元是 ____',ans:'y,x',exp:'$y$ 和最外层的 $x$ 是自由的。'},
  {id:47,hw:'2-2',type:'填空',score:8,q:'上题公式的约束变元是 ____',ans:'x,z',exp:'$\\forall x$ 约束的 $x$ 和 $\\exists z$ 约束的 $z$。'},
  {id:48,hw:'3',type:'单选',score:3,q:'$A=\\{1,2,3\\}$，下列 $R$ 是等价关系的是( )',opts:['$\\{\\langle1,2\\rangle,\\langle2,1\\rangle\\}$','$\\{\\langle1,1\\rangle,\\langle2,2\\rangle,\\langle3,3\\rangle\\}$','$\\{\\langle1,2\\rangle,\\langle2,3\\rangle,\\langle3,2\\rangle\\}$','$\\{\\langle1,1\\rangle,\\langle2,1\\rangle,\\langle3,1\\rangle\\}$'],ans:'B',exp:'B是恒等关系，满足自反、对称、传递。'},
  {id:49,hw:'3',type:'单选',score:3,q:'$A=\\{1,2,3,4\\}$，$B=\\{a,b,c\\}$，$|A \\times B|=$（ ）',opts:['3','4','7','12'],ans:'D',exp:'$4 \\times 3 = 12$。'},
  {id:50,hw:'3',type:'单选',score:3,q:'$R=\\{\\langle1,2\\rangle,\\langle2,3\\rangle,\\langle2,4\\rangle,\\langle4,3\\rangle\\}$ 在 $A=\\{1,2,3,4\\}$ 上是( )',opts:['自反的','反对称的','对称的','传递的'],ans:'B',exp:'没有 $\\langle a,b\\rangle$ 和 $\\langle b,a\\rangle$ 同时出现（$a \\neq b$）。'},
  {id:51,hw:'3',type:'单选',score:3,q:'$R=\\{\\langle1,3\\rangle,\\langle2,1\\rangle,\\langle1,2\\rangle,\\langle4,3\\rangle,\\langle3,4\\rangle\\}$ 在 $A=\\{1,2,3,4\\}$ 上是( )',opts:['自反的','反对称的','对称的','传递的'],ans:'C',exp:'每对元素都是对称出现。'},
  {id:52,hw:'3',type:'单选',score:3,q:'$A=\\{1,2,4\\}$，$B=\\{3,4\\}$，$A-B=$（ ）',opts:['{1,2,3,4}','{1,2,3}','{1,2}','{4}'],ans:'C',exp:'从 $A$ 中去掉 $B$ 的元素。'},
  {id:53,hw:'3',type:'单选',score:3,q:'$A=\\{1,2,3\\}$，$B=\\{2,3,4,5\\}$，$C=\\{2,3\\}$，$(A \\cup B) \\cap C=$（ ）',opts:['{1,2}','{2,3}','{1,4,5}','{1,2,3,4,5}'],ans:'B',exp:'$A \\cup B=\\{1,2,3,4,5\\}$，与 $C$ 交为 $\\{2,3\\}$。'},
  {id:54,hw:'3',type:'单选',score:3,q:'$X \\subseteq Y$ 则一定有( )',opts:['$x \\in y$','$x \\cup y = x$','$x \\subset y$','$x \\cap y = x$'],ans:'D',exp:'子集与原集的交等于子集本身。'},
  {id:55,hw:'3',type:'单选',score:3,q:'$X \\oplus Y=\\{1,2,3\\}$，$X \\oplus Z=\\{2,3,4\\}$，$2 \\in Y$，则( )',opts:['$1 \\in Z$','$2 \\in Z$','$3 \\in Z$','$4 \\in Z$'],ans:'B',exp:'对称差的性质推导。'},
  {id:56,hw:'3',type:'单选',score:3,q:'$A=\\{a,b,c,d\\}$，$f=\\{\\langle a,d\\rangle,\\langle b,a\\rangle,\\langle c,b\\rangle,\\langle d,c\\rangle\\}$，则 $f$ 是( )',opts:['不是函数','函数但非满射非单射','满射非单射','双射'],ans:'D',exp:'每个元素恰好映射一次，且值域覆盖整个 $A$。'},
  {id:57,hw:'3',type:'单选',score:3,q:'$S=\\{1,2,3\\}$，$R=\\{\\langle x,y\\rangle | x+y>4\\}$，则 $R$ 是( )',opts:['既不自反也不反对称','对称又反对称','对称但不反对称','反对称但不对称'],ans:'A',exp:'$R=\\{\\langle2,3\\rangle,\\langle3,2\\rangle\\}$，不自反也不反对称。'},
  {id:58,hw:'3',type:'单选',score:3,q:'$S=\\{1,2,3,4\\}$，$R=\\{\\langle1,2\\rangle,\\langle2,3\\rangle,\\langle3,4\\rangle\\}$，$R$ 具有( )',opts:['自反对称传递','反对称传递','反对称','只有反对称'],ans:'B',exp:'反对称且传递，但不自反。'},
  {id:59,hw:'3',type:'单选',score:3,q:'$R$ 的自反闭包是( )',opts:['空关系','全域关系','大于等于关系','恒等关系'],ans:'B',exp:'自反闭包 = $R \\cup I_A$，最小的包含 $R$ 的自反关系。'},
  {id:60,hw:'3',type:'判断',score:3,q:'$A=\\{a,b,\\{b\\}\\}$，$B=\\{a\\}$，则 $B \\in A$ 且 $B \\subseteq A$。',ans:'错',exp:'$B=\\{a\\}$ 不是 $A$ 的元素（$A$ 的元素是 $a,b,\\{b\\}$），所以 $B \\notin A$。'},
  {id:61,hw:'3',type:'判断',score:3,q:'$A=\\{1,2,3,4\\}$，$R=\\{\\langle1,1\\rangle,\\langle1,2\\rangle,\\langle2,1\\rangle,\\langle2,2\\rangle,\\langle3,3\\rangle,\\langle3,4\\rangle,\\langle4,3\\rangle,\\langle4,4\\rangle\\}$ 具有反对称性和传递性。',ans:'错',exp:'$\\langle1,2\\rangle$ 和 $\\langle2,1\\rangle$ 同时存在，不反对称。'},
  {id:62,hw:'3',type:'判断',score:3,q:'对称且传递的关系，$R=R \\circ R$。',ans:'错',exp:'还需自反条件。'},
  {id:63,hw:'3',type:'判断',score:3,q:'$A=\\{a,b,\\{a,b\\}\\}$，$B=\\{a,\\{b\\}\\}$，$A \\cup B=\\{a,b,\\{b\\},\\{a,b\\}\\}$。',ans:'对',exp:'并集包含所有元素。'},
  {id:64,hw:'3',type:'判断',score:3,q:'$A \\cup(B \\cap C)=(A \\cup B) \\cap(A \\cup C)$。',ans:'对',exp:'分配律。'},
  {id:65,hw:'3',type:'判断',score:3,q:'$R,S$ 都是对称关系，则 $R \\circ S$ 也是对称的。',ans:'错',exp:'复合关系不一定保持对称性。'},
  {id:66,hw:'3',type:'判断',score:3,q:'$R \\cup S$ 具有对称性，则 $R,S$ 也是对称的。',ans:'错',exp:'反例：$R$ 不对称但 $R \\cup S$ 可以对称。'},
  {id:67,hw:'3',type:'判断',score:3,q:'$M_R$ 是对称矩阵，则 $R$ 一定是对称关系。',ans:'对',exp:'邻接矩阵对称等价于关系对称。'},
  {id:68,hw:'3',type:'判断',score:3,q:'$A=\\{a,b,c,d\\}$，$R=\\{\\langle a,a\\rangle,\\langle a,c\\rangle,\\langle b,a\\rangle,\\langle c,a\\rangle,\\langle c,c\\rangle,\\langle d,a\\rangle,\\langle d,d\\rangle\\}$ 是自反的也是对称的。',ans:'错',exp:'缺少 $\\langle b,b\\rangle$，不自反。'},
  {id:69,hw:'3',type:'判断',score:3,q:'$R,S$ 都是传递关系，则 $R \\cap S$ 也是传递的。',ans:'对',exp:'交集保持传递性。'},
  {id:70,hw:'3',type:'填空',score:3,q:'$A=\\{2,a,\\{3\\},4\\}$，$B=\\{\\emptyset,4,\\{a\\},3\\}$，$A \\oplus B=$ ____',ans:'{2,a,{3},∅,{a},3}',exp:'对称差：去掉公共元素 $4$。'},
  {id:80,hw:'4',type:'填空',score:4,q:'图 $G$ 有 5 个顶点，度数序列的部分值已知，度数之和为 12，$G$ 有（ ）条边',ans:'6',exp:'$2m=12$，$m=6$。'},
  {id:81,hw:'4',type:'填空',score:4,q:'$G$ 有 16 条边，1个4度顶点，4个3度顶点，其余度数<3，$G$ 至少有（ ）个顶点',ans:'13',exp:'其余度数之和16，每个最多2度，至少8个，加上已有5个=13。'},
  {id:82,hw:'4',type:'填空',score:4,q:'$n=6$，$m=4$，各顶点度数之和为（ ）',ans:'8',exp:'握手定理：$2m=8$。'},
  {id:83,hw:'4',type:'填空',score:4,q:'邻接矩阵可分块为 $\\begin{pmatrix}0&A\\\\A^T&0\\end{pmatrix}$，则 $G$ 是（ ）图',ans:'二部图',exp:'这是二部图的邻接矩阵特征。'},

// ============================================
// localStorage 持久化
// ============================================
const LS_KEY = 'dm_quiz_v2';
const LS_HEATMAP = 'dm_quiz_heatmap_v2';

function loadData() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e) { return {}; }
}
function saveData(d) { localStorage.setItem(LS_KEY, JSON.stringify(d)); }
function loadHeatmap() {
  try { return JSON.parse(localStorage.getItem(LS_HEATMAP)) || {}; } catch(e) { return {}; }
}
function saveHeatmap(h) { localStorage.setItem(LS_HEATMAP, JSON.stringify(h)); }

let state = loadData();
if (!state.answered) state.answered = {};
if (!state.userAns) state.userAns = {};
if (!state.wrongIds) state.wrongIds = [];
if (!state.favIds) state.favIds = [];
if (!state.dailyGoal) state.dailyGoal = 20;
if (!state.todayDate) state.todayDate = '';
if (!state.todayCount) state.todayCount = 0;
if (!state.theme) state.theme = 'light';
if (!state.fontSize) state.fontSize = 'medium';

let curHW = 'all';
let curPanelTab = 'wrong';
let heatmap = loadHeatmap();
const selectedMC = {};
let currentQIndex = 0;
let filteredQs = [];

// ============================================
// 主题 & 字体
// ============================================
function setTheme(theme, el) {
  document.documentElement.setAttribute('data-theme', theme);
  state.theme = theme;
  saveData(state);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
}
function setFont(size, el) {
  const sizes = { small: '13px', medium: '15px', large: '17px' };
  document.documentElement.style.setProperty('--font-size-base', sizes[size]);
  state.fontSize = size;
  saveData(state);
  document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
}

// ============================================
// 每日目标
// ============================================
function checkDay() {
  const today = new Date().toISOString().slice(0, 10);
  if (state.todayDate !== today) {
    state.todayDate = today;
    state.todayCount = 0;
    saveData(state);
  }
}
function recordToday() {
  checkDay();
  state.todayCount++;
  const today = state.todayDate;
  heatmap[today] = (heatmap[today] || 0) + 1;
  saveHeatmap(heatmap);
  saveData(state);
  renderHeatmap();
  updateGoal();
}
function saveGoal() {
  state.dailyGoal = parseInt(document.getElementById('goal-input').value) || 20;
  saveData(state);
  updateGoal();
}
function updateGoal() {
  checkDay();
  const goal = state.dailyGoal || 20;
  const done = state.todayCount || 0;
  const pct = Math.min(100, Math.round(done / goal * 100));
  document.getElementById('goal-fill').style.width = pct + '%';
  document.getElementById('goal-text').textContent = done + ' / ' + goal;
  document.getElementById('today-count').textContent = done;
}

// ============================================
// 热力图
// ============================================
function renderHeatmap() {
  const container = document.getElementById('heatmap');
  const monthsEl = document.getElementById('heatmap-months');
  const today = new Date();
  const days = [];
  for (let i = 364; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const count = heatmap[key] || 0;
    let level = 0;
    if (count >= 20) level = 4;
    else if (count >= 10) level = 3;
    else if (count >= 5) level = 2;
    else if (count >= 1) level = 1;
    days.push({ date: d, key, level, count });
  }

  let html = '';
  const weekDays = 7;
  const totalWeeks = Math.ceil(days.length / weekDays);
  for (let w = 0; w < totalWeeks; w++) {
    html += '<div class="heatmap-week">';
    for (let d = 0; d < weekDays; d++) {
      const idx = w * weekDays + d;
      if (idx < days.length) {
        const day = days[idx];
        html += `<div class="heatmap-cell l${day.level}" title="${day.key}: ${day.count}题"></div>`;
      } else {
        html += '<div class="heatmap-cell"></div>';
      }
    }
    html += '</div>';
  }
  container.innerHTML = html;

  // months
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let mHtml = '';
  let lastMonth = -1;
  for (let w = 0; w < totalWeeks; w++) {
    const idx = w * weekDays;
    if (idx < days.length) {
      const m = days[idx].date.getMonth();
      if (m !== lastMonth) {
        mHtml += `<span class="heatmap-month">${monthNames[m]}</span>`;
        lastMonth = m;
      } else {
        mHtml += '<span class="heatmap-month"></span>';
      }
    }
  }
  monthsEl.innerHTML = mHtml;
}

// ============================================
// 连续学习天数
// ============================================
function calcStreak() {
  const today = new Date();
  today.setHours(0,0,0,0);
  let streak = 0;
  const d = new Date(today);

  const todayKey = d.toISOString().slice(0, 10);
  if (heatmap[todayKey] > 0) {
    streak = 1;
    d.setDate(d.getDate() - 1);
  } else {
    d.setDate(d.getDate() - 1);
  }

  while (true) {
    const key = d.toISOString().slice(0, 10);
    if (heatmap[key] > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// ============================================
// 导航
// ============================================
const HW_NAMES = {'1':'作业1','2-1':'作业2-1','2-2':'作业2-2','3':'作业3','4':'作业4','4-1':'作业4-1','5':'作业5'};

function initNav() {
  const hws = [...new Set(Q.map(q => q.hw))];
  let html = '<button class="active" onclick="switchHW(\'all\',this)">全部</button>';
  hws.forEach(h => { html += `<button onclick="switchHW('${h}',this)">${HW_NAMES[h] || h}</button>`; });
  document.getElementById('nav').innerHTML = html;
}

function switchHW(hw, el) {
  curHW = hw;
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentQIndex = 0;
  render();
}

function getQ() {
  return curHW === 'all' ? Q : Q.filter(q => q.hw === curHW);
}

// ============================================
// 渲染
// ============================================
function render() {
  filteredQs = getQ();
  const qs = filteredQs;
  const total = qs.length;
  const done = qs.filter(q => state.answered[q.id]).length;
  const correct = qs.filter(q => state.answered[q.id] && state.userAns[q.id] === q.ans).length;
  const wrong = done - correct;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card total"><div class="num">${total}</div><div class="label">总题数</div></div>
    <div class="stat-card done"><div class="num">${done}</div><div class="label">已做</div></div>
    <div class="stat-card right"><div class="num">${correct}</div><div class="label">正确</div></div>
    <div class="stat-card wrong"><div class="num">${wrong}</div><div class="label">错误</div></div>
    <div class="stat-card rate"><div class="num">${done ? Math.round(correct / done * 100) : 0}%</div><div class="label">正确率</div></div>
  `;
  document.getElementById('progress-fill').style.width = `${total ? done / total * 100 : 0}%`;

  let html = '';
  qs.forEach((q, qi) => {
    const isAns = state.answered[q.id];
    const isCorr = isAns && state.userAns[q.id] === q.ans;
    const isFav = state.favIds.includes(q.id);
    const cls = isAns ? (isCorr ? 'answered-correct' : 'answered-wrong') : '';
    html += `<div class="question-card ${cls}" id="card-${q.id}" data-idx="${qi}">
      <div class="q-top">
        <span class="q-num">${q.id}. <span class="q-tag">${q.type}</span> <span style="color:var(--text-secondary);font-size:11px;font-weight:400;margin-left:4px">${HW_NAMES[q.hw] || q.hw}</span></span>
        <span style="display:flex;align-items:center;gap:8px">
          ${isAns ? (isCorr ? '<span class="result-badge correct">&#10003; 正确</span>' : '<span class="result-badge wrong">&#10007; 错误</span>') : `<span style="color:var(--text-secondary);font-size:12px">${q.score}分</span>`}
          <span class="q-fav ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleFav(${q.id})" title="收藏">${isFav ? '&#9829;' : '&#9825;'}</span>
        </span>
      </div>
      <div class="q-body">${q.q}</div>`;

    if (q.type === '单选' || q.type === '多选') {
      const letters = 'ABCDEFGH';
      html += `<div class="options" id="opts-${q.id}">`;
      q.opts.forEach((o, i) => {
        let ocls = 'opt';
        if (isAns) {
          ocls += ' disabled';
          if (q.ans.includes(letters[i])) ocls += ' correct-answer';
          else if (state.userAns[q.id] && state.userAns[q.id].includes(letters[i])) ocls += ' wrong-answer';
        }
        html += `<div class="${ocls}" onclick="selectOpt(${q.id},'${letters[i]}','${q.type}')">
          <span class="letter">${letters[i]}.</span><span>${o}</span></div>`;
      });
      html += `</div>`;
      if (q.type === '多选' && !isAns) html += `<div class="multi-hint">可多选</div>`;
    } else if (q.type === '填空') {
      html += `<div class="fill-area"><input id="fill-${q.id}" placeholder="输入答案..." ${isAns ? 'disabled' : ''} 
        onkeydown="if(event.key==='Enter')submitFill(${q.id})"></div>`;
    } else if (q.type === '判断') {
      const userVal = state.userAns[q.id];
      html += `<div class="tf-btns" id="tf-${q.id}">
        <div class="tf-btn ${isAns ? (q.ans === '对' ? 'correct-answer' : '') + (userVal === '对' && q.ans !== '对' ? ' wrong-answer' : '') + (isAns ? ' disabled' : '') : ''}" 
          onclick="submitTF(${q.id},'对')">${isAns && q.ans === '对' ? '&#10003; ' : ''}对</div>
        <div class="tf-btn ${isAns ? (q.ans === '错' ? 'correct-answer' : '') + (userVal === '错' && q.ans !== '错' ? ' wrong-answer' : '') + (isAns ? ' disabled' : '') : ''}"
          onclick="submitTF(${q.id},'错')">${isAns && q.ans === '错' ? '&#10003; ' : ''}错</div>
      </div>`;
    }

    if (q.type === '单选' || q.type === '多选') {
      html += `<div class="submit-row">
        <button class="btn btn-primary" id="sub-${q.id}" onclick="submitMC(${q.id})" ${isAns ? 'disabled' : ''}>提交</button>
        ${isAns ? `<span style="font-size:13px;color:var(--text-secondary)">正确答案: ${q.ans}</span>` : ''}
      </div>`;
    }
    if (q.type === '填空' && !isAns) {
      html += `<div class="submit-row"><button class="btn btn-primary" onclick="submitFill(${q.id})">提交</button></div>`;
    }

    html += `<div class="explain-box ${isAns ? 'show' : ''}" id="exp-${q.id}">
      <div class="title">解析</div>${q.exp}</div></div>`;
  });

  if (!qs.length) html = '<div class="empty-msg">暂无题目</div>';
  document.getElementById('quiz').innerHTML = html;
  if (window.MathJax && MathJax.typeset) MathJax.typeset();
}

// ============================================
// 答题逻辑
// ============================================
function selectOpt(id, letter, type) {
  if (state.answered[id]) return;
  if (!selectedMC[id]) selectedMC[id] = type === '多选' ? new Set() : '';
  if (type === '多选') {
    if (selectedMC[id].has(letter)) selectedMC[id].delete(letter);
    else selectedMC[id].add(letter);
  } else {
    selectedMC[id] = letter;
  }
  const opts = document.querySelectorAll(`#opts-${id} .opt`);
  const letters = 'ABCDEFGH';
  opts.forEach((o, i) => {
    o.classList.remove('selected');
    if (type === '多选') {
      if (selectedMC[id].has(letters[i])) o.classList.add('selected');
    } else {
      if (selectedMC[id] === letters[i]) o.classList.add('selected');
    }
  });
}

function submitMC(id) {
  const q = Q.find(x => x.id === id);
  let ans = selectedMC[id];
  if (!ans) return;
  if (ans instanceof Set) ans = [...ans].sort().join('');
  state.answered[id] = true;
  state.userAns[id] = ans;
  if (ans !== q.ans && !state.wrongIds.includes(id)) state.wrongIds.push(id);
  else if (ans === q.ans) state.wrongIds = state.wrongIds.filter(x => x !== id);
  recordToday();
  saveData(state);
  render();
}

function submitFill(id) {
  if (state.answered[id]) return;
  const input = document.getElementById(`fill-${id}`);
  const val = input.value.trim();
  if (!val) return;
  const q = Q.find(x => x.id === id);
  state.answered[id] = true;
  state.userAns[id] = val;
  if (val !== q.ans && !state.wrongIds.includes(id)) state.wrongIds.push(id);
  else if (val === q.ans) state.wrongIds = state.wrongIds.filter(x => x !== id);
  recordToday();
  saveData(state);
  render();
}

function submitTF(id, val) {
  if (state.answered[id]) return;
  const q = Q.find(x => x.id === id);
  state.answered[id] = true;
  state.userAns[id] = val;
  if (val !== q.ans && !state.wrongIds.includes(id)) state.wrongIds.push(id);
  else if (val === q.ans) state.wrongIds = state.wrongIds.filter(x => x !== id);
  recordToday();
  saveData(state);
  render();
}

// ============================================
// 收藏
// ============================================
function toggleFav(id) {
  if (state.favIds.includes(id)) {
    state.favIds = state.favIds.filter(x => x !== id);
  } else {
    state.favIds.push(id);
  }
  saveData(state);
  render();
}

// ============================================
// 错题本 / 收藏夹面板
// ============================================
function openPanel() {
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
  renderPanel();
}
function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('open');
}
function switchPanelTab(tab, el) {
  curPanelTab = tab;
  document.querySelectorAll('#panel-tabs button').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  renderPanel();
}
function renderPanel() {
  const body = document.getElementById('panel-body');
  const footer = document.getElementById('panel-footer');

  if (curPanelTab === 'wrong') {
    if (!state.wrongIds.length) {
      body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">暂无错题</div>';
    } else {
      body.innerHTML = state.wrongIds.map(id => {
        const q = Q.find(x => x.id === id);
        if (!q) return '';
        return `<div class="wrong-item" onclick="goToQ(${id});closePanel()">
          <div class="wi-q">${q.id}. ${q.q.substring(0, 60)}${q.q.length > 60 ? '...' : ''}</div>
          <div class="wi-meta"><span>类型: ${q.type}</span><span>作业: ${HW_NAMES[q.hw] || q.hw}</span><span>正确答案: ${q.ans}</span><span>你的答案: ${state.userAns[id] || '-'}</span></div>
        </div>`;
      }).join('');
    }
    footer.innerHTML = `
      <button class="btn btn-primary btn-sm" onclick="redoWrong()">重做错题</button>
      <button class="btn btn-danger btn-sm" onclick="clearWrong()">清空错题本</button>
      <button class="btn btn-outline btn-sm" onclick="exportWrong()">导出JSON</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-wrong').click()">导入JSON</button>
      <input class="file-input" id="import-wrong" type="file" accept=".json" onchange="importWrong(event)">
    `;
  } else {
    if (!state.favIds.length) {
      body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">暂无收藏</div>';
    } else {
      body.innerHTML = state.favIds.map(id => {
        const q = Q.find(x => x.id === id);
        if (!q) return '';
        return `<div class="fav-item" onclick="goToQ(${id});closePanel()">
          <div class="fi-q">${q.id}. ${q.q.substring(0, 60)}${q.q.length > 60 ? '...' : ''}</div>
          <div class="fi-meta"><span>类型: ${q.type}</span><span>作业: ${HW_NAMES[q.hw] || q.hw}</span></div>
        </div>`;
      }).join('');
    }
    footer.innerHTML = `
      <button class="btn btn-danger btn-sm" onclick="clearFav()">清空收藏</button>
      <button class="btn btn-outline btn-sm" onclick="exportFav()">导出JSON</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-fav').click()">导入JSON</button>
      <input class="file-input" id="import-fav" type="file" accept=".json" onchange="importFav(event)">
    `;
  }
}

function goToQ(id) {
  const q = Q.find(x => x.id === id);
  if (!q) return;
  curHW = q.hw;
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.remove('active');
    if (b.textContent === (HW_NAMES[q.hw] || q.hw) || (curHW === 'all' && b.textContent === '全部')) b.classList.add('active');
  });
  render();
  setTimeout(() => {
    const el = document.getElementById('card-' + id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function redoWrong() {
  if (!state.wrongIds.length) return;
  state.wrongIds.forEach(id => {
    state.answered[id] = false;
    delete state.userAns[id];
  });
  state.wrongIds = [];
  saveData(state);
  render();
  renderPanel();
  closePanel();
}

function clearWrong() {
  if (!confirm('确定清空错题本？')) return;
  state.wrongIds = [];
  saveData(state);
  renderPanel();
}
function clearFav() {
  if (!confirm('确定清空收藏？')) return;
  state.favIds = [];
  saveData(state);
  renderPanel();
}

// ============================================
// 导入导出
// ============================================
function exportWrong() {
  const data = state.wrongIds.map(id => {
    const q = Q.find(x => x.id === id);
    return { id, type: q.type, hw: q.hw, question: q.q, answer: q.ans, userAnswer: state.userAns[id], explanation: q.exp };
  });
  downloadJSON(data, '离散数学_错题本.json');
}
function exportFav() {
  const data = state.favIds.map(id => {
    const q = Q.find(x => x.id === id);
    return { id, type: q.type, hw: q.hw, question: q.q, answer: q.ans, explanation: q.exp };
  });
  downloadJSON(data, '离散数学_收藏夹.json');
}
function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importWrong(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      data.forEach(item => {
        if (item.id && !state.wrongIds.includes(item.id)) state.wrongIds.push(item.id);
        if (item.id && item.userAnswer) state.userAns[item.id] = item.userAnswer;
      });
      saveData(state);
      renderPanel();
      alert('导入成功！');
    } catch(err) { alert('导入失败：文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}
function importFav(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      data.forEach(item => {
        if (item.id && !state.favIds.includes(item.id)) state.favIds.push(item.id);
      });
      saveData(state);
      renderPanel();
      alert('导入成功！');
    } catch(err) { alert('导入失败：文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============================================
// 更新日志
// ============================================
function toggleChangelog() {
  const modal = document.getElementById('changelog-modal');
  modal.classList.toggle('open');
}

// ============================================
// 快捷键
// ============================================
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'radio') return;
  if (e.key === 'Enter') {
    // 提交当前题
    if (filteredQs.length) {
      const q = filteredQs[currentQIndex];
      if (q && !state.answered[q.id]) {
        if (q.type === '单选' || q.type === '多选') submitMC(q.id);
        else if (q.type === '填空') submitFill(q.id);
      }
    }
  } else if (e.key === 'Escape') {
    // 清空当前选择
    if (filteredQs.length) {
      const q = filteredQs[currentQIndex];
      if (q && !state.answered[q.id]) {
        if (q.type === '单选' || q.type === '多选') {
          selectedMC[q.id] = q.type === '多选' ? new Set() : '';
          const opts = document.querySelectorAll(`#opts-${q.id} .opt`);
          opts.forEach(o => o.classList.remove('selected'));
        } else if (q.type === '填空') {
          const input = document.getElementById(`fill-${q.id}`);
          if (input) input.value = '';
        }
      }
    }
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (!filteredQs.length) return;
    if (e.key === 'ArrowRight') currentQIndex = Math.min(filteredQs.length - 1, currentQIndex + 1);
    else currentQIndex = Math.max(0, currentQIndex - 1);
    scrollToQ(filteredQs[currentQIndex].id);
  } else if (e.key === ' ' && !e.target.closest('.fill-area input')) {
    e.preventDefault();
    randomQ();
  }
});

function scrollToQ(id) {
  const el = document.getElementById('card-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function randomQ() {
  if (!filteredQs.length) return;
  currentQIndex = Math.floor(Math.random() * filteredQs.length);
  scrollToQ(filteredQs[currentQIndex].id);
}

// ============================================
// 点击题目跟踪索引
// ============================================
document.addEventListener('click', function(e) {
  const card = e.target.closest('.question-card');
  if (card) {
    const idx = parseInt(card.dataset.idx);
    if (!isNaN(idx)) currentQIndex = idx;
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ============================================
// 初始化
// ============================================
function init() {
  checkDay();
  setTheme(state.theme, null);
  setFont(state.fontSize, null);
  document.getElementById('goal-input').value = state.dailyGoal || 20;

  // 确保主题按钮高亮
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.remove('active');
    if ((state.theme === 'light' && b.title === '日间') ||
        (state.theme === 'dark' && b.title === '夜间') ||
        (state.theme === 'eye-care' && b.title === '护眼')) b.classList.add('active');
  });
  document.querySelectorAll('.font-btn').forEach(b => {
    b.classList.remove('active');
    if ((state.fontSize === 'medium' && b.textContent === '中') ||
        (state.fontSize === 'small' && b.textContent === '小') ||
        (state.fontSize === 'large' && b.textContent === '大')) b.classList.add('active');
  });

  document.getElementById('streak-num').textContent = calcStreak();
  renderHeatmap();
  updateGoal();
  initNav();
  render();
}

init();
